<style>
html, body {
    height: 100%;
    margin: 0;
    font-family: arial, sans-serif;
}
body{
    display: flex;
    flex-direction: column;
    text-align: center;
}
header{
    padding: 20px;
    background-color: rgb(236, 145, 145);
}
h1{
    color: #fff; /* Color del texto (blanco para que resalte el neón) */
    text-shadow: 
        0 0 5px #fff, 
        0 0 10px #fff, 
        0 0 20px #bc13fe, 
        0 0 40px #bc13fe, 
        0 0 80px #bc13fe;
}
main{
    flex: 1;
    padding: 20px;
    max-width: 1200px;
    margin: 0 auto;
}
footer{
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 50px;
    border-top: 1px solid rgb(235, 232, 187);
    background-color: cornflowerblue;
    }
    /* Estilo base para la imagen del footer */
    footer img{
    transition: transform 0.3s ease; /* Hace que el zoom sea fluido */
    cursor: pointer; /* Cambia el cursor a una mano para indicar que es interactivo */
    }

    /* Efecto cuando el mouse para por encima (:hover) */
    footer img:hover {
        transform: scale(1,2); /* Aumenta el tamaño un 20% */
    }
    .semana {
    background-color: #ffffff; /* Fondo blanco para que resalte */
    border-radius: 15px;       /* Bordes redondeados para elegancia */
    padding: 20px;             /* Espacio interno para que el texto no toque los bordes */
    margin: 20px 0;            /* Espacio entre una tarjeta y otra */
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); /* Sombra suave para dar profundidad */
    border-left: 5px solid #bc13fe; /* Una línea decorativa morada al lado izquierdo */
    transition: 0.3s;          /* Para que si añades efectos, sean fluidos */
    text-align: left;          /* Alineamos el texto a la izquierda para mejor lectura */
    }
    .semana:hover {
    box-shadow: 0 8px 25px rgba(188, 19, 254, 0.2); /* La sombra brilla morado al pasar el mouse */
    transform: translateY(-5px); /* La tarjeta "flota" un poquito hacia arriba */
    }
</style>
